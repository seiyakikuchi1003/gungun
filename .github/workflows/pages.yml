# モックプレビュー（gungun-preview-public.html）を GitHub Pages で公開する。
# 公開URL: https://seiyakikuchi1003.github.io/gungun/
name: Publish preview to GitHub Pages

on:
  push:
    branches: [claude/app-design-mockup-9f1vtu]
    paths:
      - gungun-preview-public.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site directory
        run: |
          mkdir -p _site
          cp gungun-preview-public.html _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
